<style>
:root{
  --bg:#fff7fb;
  --card:#fff;
  --ink:#2b2630;
  --muted:#8b8291;
  --pink:#ff648e;
  --pink2:#ff8fab;
  --lav:#8d7cf6;
  --line:#f0dfe7;
  --soft:#fff0f5;
  --green:#36b985;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#fff8fb 0%,#fff 70%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding:18px 14px 96px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 2px 14px;
}

.brand small{
  display:block;
  color:var(--muted);
  font-weight:700;
  font-size:11px;
  letter-spacing:.08em;
}

.brand b{
  font-size:22px;
  color:var(--pink);
}

.sync{
  font-size:12px;
  padding:7px 10px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--line);
  color:var(--muted);
}

.page{display:none}
.page.active{display:block}

.hero{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(111,55,82,.07);
}

.hero-photo{
  height:230px;
  background:linear-gradient(135deg,#ffe0ea,#efe9ff);
  display:flex;
  align-items:center;

}

.hero-photo img{
  width:100%;

}

.placeholder{

  text-align:center;
  line-height:1.6;
}

.hero-body{padding:18px}

.eyebrow{
  font-size:12px;
  color:var(--pink);
  font-weight:800;
}

.days{
  font-size:40px;
  font-weight:900;
  letter-spacing:-.04em;
  margin:4px 0;
}

.dateText{
  color:var(--muted);
  font-size:13px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:14px 0;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:13px 8px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:24px;
}

.stat span{
  font-size:11px;
  color:var(--muted);
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 6px 24px rgba(111,55,82,.045);
}

.card h2{
  font-size:17px;
  margin:0 0 12px;
}

input,select,textarea,button{font:inherit}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fffafb;
  color:var(--ink);
  border-radius:14px;
  padding:12px 13px;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
  line-height:1.55;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.full{grid-column:1/-1}

button{
  border:0;
  border-radius:14px;
  padding:12px 14px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:linear-gradient(135deg,var(--pink),#ff79ad);

}

.secondary{
  background:#fff0f5;
  color:var(--pink);
  border:1px solid #ffd2df;

.ghost{

  color:var(--muted);

}

.danger{
  background:#fff2f2;
  color:#d95b72;
  border:1px solid #ffd9df;

.photo-controls{

  grid-template-columns:1fr auto;

}

.section-title{
  font-size:25px;

}

.section-sub{

}

.filters{

}

.place{

}

.place.done{opacity:.78}

.place-top{

}

.place-title{

}

.meta{

.badges{

}

.badge{

.badge.like{

.memoText{

a{

.connect{

}

.connect-code{

.save-state{

.bottomnav{

.navbtn{

.navbtn span{

.navbtn.active{

.clothing{

.clothing-image{

<script>

const API =
  "https://dnznentpxeyrkokwhwyb.supabase.co/functions/v1/couple-state";

const CODE_KEY = 'futari-share-code-v1';

let state = {
  nextDate:null,
  freeMemo:'',
  places:[],
  clothes:[],
  heroPhoto:''
};

let currentFilter = '全部';
let currentClothesFilter = '全部';
let syncTimer = null;
let memoTimer = null;

const clothesFilterItems = ['全部','あかり','タクミ','おそろい','お気に入り','未購入','購入済み'];

const filterItems = [
  '全部',
  '両想い候補',
  'タクミ❤️',
  'あかり❤️',
  'ごはん',
  'カフェ',
  '遊び',
  '旅行',
  '買い物',
  'ホテル'
];

function esc(s=''){
  return String(s).replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function code(){
  try{
    return (localStorage.getItem(CODE_KEY)||'')
      .trim()
      .toUpperCase();
  }catch(e){
    return '';
  }
}

function setSync(msg){
  document.getElementById('syncState').textContent = msg;
}

function normalize(){

  state.nextDate = state.nextDate || null;
  state.freeMemo = state.freeMemo || '';
  state.heroPhoto = state.heroPhoto || '';

  state.places = Array.isArray(state.places)
    ? state.places.map(p => {

        const likes =
          p.likes || {
            takumi:!!p.hot,
            akari:false
          };

        return {
          ...p,
          author:p.author === '彼女'
            ? 'あかり'
            : p.author,

          likes:{
            takumi:!!likes.takumi,
            akari:!!likes.akari
          }
        };

      })
    : [];

  state.clothes = Array.isArray(state.clothes)
    ? state.clothes.map(c => ({
        id:c.id || Date.now() + Math.random(),
        name:c.name || '服候補',
        brand:c.brand || '',
        forWho:c.forWho || 'あかり',
        price:c.price || '',
        size:c.size || '',
        url:c.url || '',
        image:c.image || '',
        memo:c.memo || '',
        liked:!!c.liked,
        bought:!!c.bought
      }))
    : [];
}

async function loadRemote(silent=false){

  const c = code();

  if(!c) return;

  try{

    const r = await fetch(
      API + '?code=' + encodeURIComponent(c),
      {cache:'no-store'}
    );

    if(!r.ok) throw 0;

    const d = await r.json();

    if(d.state){
      state = d.state;
      normalize();
      renderAll();
    }

    setSync('共有中 ✓');

  }catch(e){

    if(!silent){
      setSync('コードを確認');
    }

  }
}

async function saveRemote(){

  const c = code();

  if(!c){
    setSync('未接続');
    return;
  }

  try{

    setSync('同期中…');

    const r = await fetch(API,{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        code:c,
        state
      })
    });

    if(!r.ok) throw 0;

    setSync('共有中 ✓');

  }catch(e){

    setSync('同期失敗');

  }
}

async function connect(){

  const c =
    document.getElementById('shareCode')
      .value
      .trim()
      .toUpperCase();

  if(!c){
    return alert('共有コードを入れて！');
  }

  localStorage.setItem(CODE_KEY,c);

  await loadRemote();

  if(code()){
    document.getElementById('connectCard').style.display='none';
  }

  if(syncTimer){
    clearInterval(syncTimer);
  }

  syncTimer =
    setInterval(
      () => loadRemote(true),
      5000
    );
}

function renderCountdown(){

  const d = state.nextDate;

  const days =
    document.getElementById('countdownDays');

  const txt =
    document.getElementById('countdownDate');

  if(!d || !d.date){

    days.textContent =
      '日付を設定してね ♡';

    txt.textContent = '';

    return;
  }

  document.getElementById('dateInput').value =
    d.date;

  document.getElementById('dateName').value =
    d.name || '';

  const [y,m,dd] =
    d.date
      .split('-')
      .map(Number);

  const now = new Date();

  const diff =
    Math.round(
      (
        Date.UTC(y,m-1,dd)
        -
        Date.UTC(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        )
      )
      /86400000
    );

  days.textContent =
    diff > 0
      ? 'あと ' + diff + ' 日 ♡'
      : diff === 0
      ? '今日がデート ♡'
      : 'デートから ' +
        Math.abs(diff) +
        ' 日';

  txt.textContent =
    (
      d.name
        ? d.name + ' ・ '
        : ''
    )
    +
    new Date(
      y,
      m-1,
      dd
    ).toLocaleDateString(
      'ja-JP',
      {
        year:'numeric',
        month:'long',
        day:'numeric',
        weekday:'short'
      }
    );
}

async function saveDate(){

  const date =
    document.getElementById('dateInput').value;

  const name =
    document.getElementById('dateName')
      .value
      .trim();

  if(!date){
    return alert('日付を入れて！');
  }

  state.nextDate = {
    date,
    name
  };

  renderCountdown();

  await saveRemote();
}

function renderPhoto(){

  const img =
    document.getElementById('heroPhoto');

  const ph =
    document.getElementById('heroPhotoPlaceholder');

  if(state.heroPhoto){

    img.src = state.heroPhoto;
    img.style.display='block';
    ph.style.display='none';

  }else{

    img.style.display='none';
    ph.style.display='block';

  }
}

function setupPhoto(){

  document.getElementById('photoInput')
    .addEventListener(
      'change',
      e => {

        const f =
          e.target.files &&
          e.target.files[0];

        if(!f) return;

        const rd =
          new FileReader();

        const im =
          new Image();

        rd.onload = () => {

          im.onload = async () => {

            const max = 900;

            const s =
              Math.min(
                1,
                max / im.width
              );

            const cv =
              document.createElement('canvas');

            cv.width =
              Math.round(
                im.width * s
              );

            cv.height =
              Math.round(
                im.height * s
              );

            cv.getContext('2d')
              .drawImage(
                im,
                0,
                0,
                cv.width,
                cv.height
              );

            state.heroPhoto =
              cv.toDataURL(
                'image/jpeg',
                .72
              );

            renderPhoto();

            await saveRemote();
          };

          im.src =
            rd.result;
        };

        rd.readAsDataURL(f);
      }
    );

  document.getElementById('removePhotoBtn')
    .onclick =
      async () => {

        state.heroPhoto = '';

        renderPhoto();

        await saveRemote();
      };
}

async function addPlace(){

  const name =
    document.getElementById('name')
      .value
      .trim();

  if(!name){
    return alert('場所の名前を入れて！');
  }

  state.places.unshift({

    id:Date.now(),

    name,

    category:
      document.getElementById('category').value,

    author:
      document.getElementById('author').value,

    area:
      document.getElementById('area')
        .value
        .trim(),

    url:
      document.getElementById('url')
        .value
        .trim(),

    memo:
      document.getElementById('memo')
        .value
        .trim(),

    likes:{
      takumi:false,
      akari:false
    },

    done:false
  });

  [
    'name',
    'area',
    'url',
    'memo'
  ].forEach(
    id =>
      document.getElementById(id).value=''
  );

  renderLists();

  await saveRemote();
}

async function toggleLike(id,who){

  const p =
    state.places.find(
      x => x.id === id
    );

  if(!p) return;

  p.likes =
    p.likes || {
      takumi:false,
      akari:false
    };

  p.likes[who] =
    !p.likes[who];

  renderAll();

  await saveRemote();
}

async function toggleDone(id){

  const p =
    state.places.find(
      x => x.id === id
    );

  if(!p) return;

  p.done =
    !p.done;

  renderAll();

  await saveRemote();
}

async function removePlace(id){

  if(
    !confirm(
      'この場所を削除する？'
    )
  ){
    return;
  }

  state.places =
    state.places.filter(
      x => x.id !== id
    );

  renderAll();

  await saveRemote();
}

function matches(p){

  if(currentFilter === '全部'){
    return true;
  }

  if(currentFilter === '両想い候補'){
    return (
      p.likes?.takumi &&
      p.likes?.akari
    );
  }

  if(currentFilter === 'タクミ❤️'){
    return p.likes?.takumi;
  }

  if(currentFilter === 'あかり❤️'){
    return p.likes?.akari;
  }

  return (
    p.category ===
    currentFilter
  );
}

  const a =

  const m =
    t && a;

  return `
    <article class="place ${p.done?'done':''}">

      <div class="place-top">

        <div>
          <div class="place-title">
            ${esc(p.name)}
          </div>

          <div class="meta">
            ${esc(p.area || 'エリア未設定')}
            ・
            ${esc(p.author)}が追加
          </div>
        </div>

        <div style="font-size:22px">
          ${m ? '💞' : (t || a ? '❤️' : '')}
        </div>

      </div>

      <div class="badges">

        <span class="badge">
          ${esc(p.category)}
        </span>

        ${
          t
            ? '<span class="badge like">タクミ ❤️</span>'
            : ''
        }

        ${
          a
            ? '<span class="badge like">あかり ❤️</span>'
            : ''
        }

        ${
          m
            ? '<span class="badge mutual">両想い候補 💞</span>'
            : ''
        }

      </div>

      ${
        p.memo
          ? `<div class="memoText">${esc(p.memo)}</div>`
          : ''
      }

      ${
        p.url
          ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">リンクを開く ↗</a>`
          : ''
      }

      <div class="actions">

        <button
          class="secondary"
          data-like-t="${p.id}">
          ${t ? 'タクミ ❤️解除' : 'タクミ ❤️'}
        </button>

        <button
          class="secondary"
          data-like-a="${p.id}">
          ${a ? 'あかり ❤️解除' : 'あかり ❤️'}
        </button>

        <button
          class="ghost"
          data-done="${p.id}">
          ${p.done ? '行きたいに戻す' : '✓ 行った'}
        </button>

        <button
          class="danger"
          data-del="${p.id}">
          削除
        </button>

      </div>

    </article>
  `;

function wire(){

  document
    .querySelectorAll('[data-like-t]')
    .forEach(
      b =>
        b.onclick =
          () =>
            toggleLike(
              Number(b.dataset.likeT),
              'takumi'
            )
    );

  document
    .querySelectorAll('[data-like-a]')
    .forEach(
      b =>
        b.onclick =
          () =>
            toggleLike(
              Number(b.dataset.likeA),
              'akari'
            )
    );

  document
    .querySelectorAll('[data-done]')
    .forEach(
      b =>
        b.onclick =
          () =>
            toggleDone(
              Number(b.dataset.done)
            )
    );

    .querySelectorAll('[data-del]')

      b =>

function renderLists(){

  document.getElementById('filters')
    .innerHTML =
      filterItems
        .map(
          f =>
            `
            <button
              class="chip ${f===currentFilter?'active':''}"
              data-filter="${esc(f)}">
              ${esc(f)}
            </button>
            `
        )
        .join('');

  document
    .querySelectorAll('[data-filter]')
    .forEach(
      b =>
        b.onclick =
          () => {
            currentFilter =
              b.dataset.filter;

            renderLists();
          }
    );

  const wish =
    state.places.filter(
      p =>
        !p.done &&
        matches(p)
    );

    state.places.filter(
      p =>
        p.done
    );

  document.getElementById('wishList')
    .innerHTML =
      wish.length
        ? wish.map(card).join('')
        : `

            まだ候補なし。<br>

  wire();
}

function safeUrl(s=''){
  const v=String(s).trim();

  if(!v)return '';

  try{
    const u=new URL(v);
    return (u.protocol==='http:'||u.protocol==='https:')?u.href:'';
  }catch(e){
    return '';
  }
}

function safeImageSrc(s=''){
  const v=String(s).trim();

  if(!v)return '';

  if(/^data:image\//i.test(v)){
    return v;
  }

  return safeUrl(v);
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{

    const reader=new FileReader();
    const img=new Image();

    reader.onload=()=>{

      img.onload=()=>{

        const max=1100;
        const scale=Math.min(1,max/img.width);

        const canvas=document.createElement('canvas');

        canvas.width=Math.round(img.width*scale);
        canvas.height=Math.round(img.height*scale);

        canvas
          .getContext('2d')
          .drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );

        resolve(
          canvas.toDataURL(
            'image/jpeg',
            0.78
          )
        );
      };

      img.onerror=reject;
      img.src=reader.result;
    };

    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function addClothes(){
  const name=document.getElementById('clothesName').value.trim();

  if(!name)return alert('商品名を入れて！');

  const fileInput=document.getElementById('clothesImage');
  let image='';

  if(fileInput.files && fileInput.files[0]){
    try{
      image=await fileToDataUrl(fileInput.files[0]);
    }catch(e){
      alert('画像の読み込みに失敗したよ');
      return;
    }
  }

  state.clothes.unshift({
    id:Date.now(),
    name,
    brand:document.getElementById('clothesBrand').value.trim(),
    forWho:document.getElementById('clothesFor').value,
    price:document.getElementById('clothesPrice').value.trim(),
    size:document.getElementById('clothesSize').value.trim(),
    url:document.getElementById('clothesUrl').value.trim(),
    image,
    memo:document.getElementById('clothesMemo').value.trim(),
    liked:false,
    bought:false
  });

  ['clothesName','clothesBrand','clothesPrice','clothesSize','clothesUrl','clothesMemo']
    .forEach(id=>document.getElementById(id).value='');
  fileInput.value='';

  renderClothes();
  await saveRemote();
}

function clothingMatches(c){
  if(currentClothesFilter==='全部')return true;
  if(currentClothesFilter==='お気に入り')return c.liked;
  if(currentClothesFilter==='未購入')return !c.bought;
  if(currentClothesFilter==='購入済み')return c.bought;
  return c.forWho===currentClothesFilter;
}

function formatPrice(v){
  const raw=String(v||'').trim();
  const n=Number(raw.replace(/[^\d]/g,''));
  return n ? '¥'+n.toLocaleString('ja-JP') : (raw ? esc(raw) : '価格未設定');
}

function clothingCard(c){
  const url=safeUrl(c.url);
  const image=safeImageSrc(c.image);

  return `
    <article class="clothing ${c.bought?'bought':''}">
      <div class="clothing-top">
        <div>
          <div class="clothing-title">${esc(c.name)}</div>
          <div class="meta">${esc(c.brand||'ブランド未設定')} ・ ${esc(c.forWho||'あかり')}用</div>
        </div>
        <div style="font-size:22px">${c.liked?'❤️':''}</div>
      </div>

      ${image?`<img class="clothing-image" src="${esc(image)}" alt="${esc(c.name)}" loading="lazy">`:''}

      <div class="badges">
        <span class="badge">${esc(c.forWho||'あかり')}</span>
        ${c.size?`<span class="badge">サイズ ${esc(c.size)}</span>`:''}
        ${c.liked?'<span class="badge like">お気に入り ❤️</span>':''}
        ${c.bought?'<span class="badge bought">購入済み ✓</span>':''}
      </div>

      <div class="price">${formatPrice(c.price)}</div>
      ${c.memo?`<div class="memoText">${esc(c.memo)}</div>`:''}
      ${url?`<a href="${esc(url)}" target="_blank" rel="noopener">商品ページを開く ↗</a>`:''}

      <div class="actions">
        <button class="secondary" data-clothes-like="${c.id}">${c.liked?'❤️解除':'❤️お気に入り'}</button>
        <button class="ghost" data-clothes-bought="${c.id}">${c.bought?'未購入に戻す':'✓ 買った'}</button>
        <button class="danger full" data-clothes-del="${c.id}">削除</button>
      </div>
    </article>
  `;
}

async function toggleClothesLike(id){
  const c=state.clothes.find(x=>x.id===id);
  if(!c)return;
  c.liked=!c.liked;
  renderClothes();
  await saveRemote();
}

async function toggleClothesBought(id){
  const c=state.clothes.find(x=>x.id===id);
  if(!c)return;
  c.bought=!c.bought;
  renderClothes();
  await saveRemote();
}

async function removeClothes(id){
  if(!confirm('この服候補を削除する？'))return;
  state.clothes=state.clothes.filter(x=>x.id!==id);
  renderClothes();
  await saveRemote();
}

function renderClothes(){
  document.getElementById('clothesFilters').innerHTML=clothesFilterItems.map(
    f=>`<button class="chip ${f===currentClothesFilter?'active':''}" data-clothes-filter="${esc(f)}">${esc(f)}</button>`
  ).join('');

  document.querySelectorAll('[data-clothes-filter]').forEach(
    b=>b.onclick=()=>{
      currentClothesFilter=b.dataset.clothesFilter;
      renderClothes();
    }
  );

  const items=state.clothes.filter(clothingMatches);

  document.getElementById('clothesList').innerHTML=
    items.length?items.map(clothingCard).join(''):
    '<div class="empty">まだ服候補なし。<br>気になる服を追加しよう 👗</div>';

  document.querySelectorAll('[data-clothes-like]').forEach(
    b=>b.onclick=()=>toggleClothesLike(Number(b.dataset.clothesLike))
  );

  document.querySelectorAll('[data-clothes-bought]').forEach(
    b=>b.onclick=()=>toggleClothesBought(Number(b.dataset.clothesBought))
  );

  document.querySelectorAll('[data-clothes-del]').forEach(
    b=>b.onclick=()=>removeClothes(Number(b.dataset.clothesDel))
  );
}

      ).length;
}

      state.freeMemo =

      clearTimeout(memoTimer);

      memoTimer =
        setTimeout(
          async () => {

            await saveRemote();

            label.textContent =
              '保存しました ✓';

function switchTab(tab){

  document
    .querySelectorAll('.page')
    .forEach(
      p =>
        p.classList.remove('active')
    );

  document
    .getElementById('page-'+tab)
    .classList.add('active');

  document
    .querySelectorAll('.navbtn')
    .forEach(
      b =>
        b.classList.toggle(
          'active',
          b.dataset.tab === tab
        )
    );

  window.scrollTo(0,0);
}
